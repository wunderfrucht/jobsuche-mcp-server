name: Release NPM Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        default: "v0.1.0"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --package jobsuche-mcp-server

      - name: Prepare binary (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/jobsuche-mcp-server dist/
          cd dist
          tar -czf jobsuche-mcp-server-${{ github.event.release.tag_name || github.event.inputs.version }}-${{ matrix.target }}.tar.gz jobsuche-mcp-server

      - name: Prepare binary (Windows)
        if: matrix.archive == 'zip'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/jobsuche-mcp-server.exe dist/
          cd dist
          Compress-Archive -Path jobsuche-mcp-server.exe -DestinationPath jobsuche-mcp-server-${{ github.event.release.tag_name || github.event.inputs.version }}-${{ matrix.target }}.zip

      - name: Upload binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ github.event.release.tag_name || github.event.inputs.version }}
          FILE="dist/jobsuche-mcp-server-${VERSION}-${{ matrix.target }}.${{ matrix.archive }}"

          # Generate SHA256 checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${FILE}" > "${FILE}.sha256"
          else
            shasum -a 256 "${FILE}" > "${FILE}.sha256"
          fi

          # Check if release exists, create if not
          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release create "${VERSION}" --title "Release ${VERSION}" --notes "Auto-generated release for ${VERSION}"
          fi

          # Upload or update archive asset
          if gh release view "${VERSION}" --json assets --jq '.assets[].name' | grep -q "jobsuche-mcp-server-${VERSION}-${{ matrix.target }}.${{ matrix.archive }}"; then
            gh release delete-asset "${VERSION}" "jobsuche-mcp-server-${VERSION}-${{ matrix.target }}.${{ matrix.archive }}" --yes
          fi
          gh release upload "${VERSION}" "${FILE}"

          # Upload or update checksum asset
          if gh release view "${VERSION}" --json assets --jq '.assets[].name' | grep -q "jobsuche-mcp-server-${VERSION}-${{ matrix.target }}.${{ matrix.archive }}.sha256"; then
            gh release delete-asset "${VERSION}" "jobsuche-mcp-server-${VERSION}-${{ matrix.target }}.${{ matrix.archive }}.sha256" --yes
          fi
          gh release upload "${VERSION}" "${FILE}.sha256"

  publish-npm:
    name: Publish to NPM
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"

      - name: Update package version and dependencies
        working-directory: npm
        run: |
          VERSION=${{ github.event.release.tag_name || github.event.inputs.version }}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}

          # Update main package: name, version, bin and optionalDependencies
          jq --arg version "$VERSION" '
            .name = "@wunderfrucht/jobsuche-mcp-server" |
            .version = $version |
            .bin = {"jobsuche-mcp-server": "./run.js"} |
            .optionalDependencies = {
              "@wunderfrucht/jobsuche-mcp-server-darwin-arm64": $version,
              "@wunderfrucht/jobsuche-mcp-server-darwin-x64": $version,
              "@wunderfrucht/jobsuche-mcp-server-linux-x64": $version,
              "@wunderfrucht/jobsuche-mcp-server-win32-x64": $version
            }
          ' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Publish to NPM
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create NPM release summary
        run: |
          echo "## 📦 NPM Package Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Package: \`@wunderfrucht/jobsuche-mcp-server\`" >> $GITHUB_STEP_SUMMARY
          echo "Version: \`${{ github.event.release.tag_name || github.event.inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Usage:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Run with npx (no installation)" >> $GITHUB_STEP_SUMMARY
          echo "npx @wunderfrucht/jobsuche-mcp-server --help" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Or install globally" >> $GITHUB_STEP_SUMMARY
          echo "npm install -g @wunderfrucht/jobsuche-mcp-server" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  build-platform-packages:
    name: Build Platform Packages
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            binary: jobsuche-mcp-server
          - target: x86_64-apple-darwin
            platform: darwin-x64
            binary: jobsuche-mcp-server
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64
            binary: jobsuche-mcp-server
          - target: x86_64-pc-windows-msvc
            platform: win32-x64
            binary: jobsuche-mcp-server.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ github.event.release.tag_name || github.event.inputs.version }}
          ARCHIVE_EXT=${{ matrix.target == 'x86_64-pc-windows-msvc' && 'zip' || 'tar.gz' }}
          ASSET_NAME="jobsuche-mcp-server-${VERSION}-${{ matrix.target }}.${ARCHIVE_EXT}"
          CHECKSUM_NAME="${ASSET_NAME}.sha256"

          # Download the release asset and its checksum
          gh release download "${VERSION}" --pattern "${ASSET_NAME}" --dir ./temp
          gh release download "${VERSION}" --pattern "${CHECKSUM_NAME}" --dir ./temp

          # Verify checksum before extracting
          cd temp
          EXPECTED=$(cat "${CHECKSUM_NAME}" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')
          ACTUAL=$(sha256sum "${ASSET_NAME}" | awk '{print $1}')
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "❌ Checksum mismatch for ${ASSET_NAME}"
            echo "   Expected: ${EXPECTED}"
            echo "   Got:      ${ACTUAL}"
            exit 1
          fi
          echo "✅ Checksum verified for ${ASSET_NAME}"

          # Extract the binary
          if [[ "${ARCHIVE_EXT}" == "zip" ]]; then
            unzip "${ASSET_NAME}"
          else
            tar -xzf "${ASSET_NAME}"
          fi

          # Move binary to platform package directory
          mv "${{ matrix.binary }}" "../platform-packages/${{ matrix.platform }}/"

      - name: Update platform package version and name
        working-directory: platform-packages/${{ matrix.platform }}
        run: |
          VERSION=${{ github.event.release.tag_name || github.event.inputs.version }}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}

          # Update platform package version and ensure correct name
          jq --arg version "$VERSION" --arg platform "${{ matrix.platform }}" '
            .name = ("@wunderfrucht/jobsuche-mcp-server-" + $platform) |
            .version = $version
          ' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Publish platform package
        working-directory: platform-packages/${{ matrix.platform }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Clean up
        run: rm -rf temp
